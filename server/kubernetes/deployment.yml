apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: mern-recipe-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: server
        image: "${SERVER_IMAGE}:${IMAGE_TAG}"
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-env
